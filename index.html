<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Research Graph Index</titltle>

  //fonts.googleapis.com">
  //fonts.gstatic.com" crossorigigin>
  //fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f6f4ef;
      --surface: #fcfbf8;
      --surface-2: #f1ede6;
      --border: #ddd7cf;
      --text: #1f1c17;
      --muted: #6f6a63;
      --accent: #0d6b6f;
      --accent-soft: #d9e8e6;
      --shadow: 0 10px 30px rgba(28, 24, 18, 0.08);
      --radius: 18px;
      --radius-sm: 12px;
      --max: 980px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: "Inter", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(13, 107, 111, 0.08), transparent 28%),
        radial-gradient(circle at top right, rgba(13, 107, 111, 0.05), transparent 22%),
        var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    .page {
      max-width: var(--max);
      margin: 0 auto;
      padding: 40px 20px 72px;
    }

    .hero {
      padding: 28px 0 20px;
    }

    .eyebrow {
      display: inline-block;
      margin-bottom: 14px;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    h1 {
      margin: 0 0 12px;
      font-family: "Instrument Serif", serif;
      font-size: clamp(2.4rem, 5vw, 4.4rem);
      line-height: 0.96;
      letter-spacing: -0.03em;
      font-weight: 400;
      max-width: 10ch;
    }

    .intro {
      margin: 0;
      max-width: 62ch;
      color: var(--muted);
      font-size: 1.02rem;
    }

    .panel {
      background: rgba(252, 251, 248, 0.86);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 28px;
      margin-top: 28px;
    }

    .section + .section {
      margin-top: 28px;
      padding-top: 28px;
      border-top: 1px solid var(--border);
    }

    .section-header {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .section-title {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .section-note {
      margin: 0;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    .chart-link {
      display: block;
      text-decoration: none;
      color: inherit;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 16px 18px;
      transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    }

    .chart-link:hover {
      transform: translateY(-2px);
      border-color: #bfc9c8;
      box-shadow: 0 10px 24px rgba(23, 31, 31, 0.08);
      background: #fff;
    }

    .chart-link:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .chart-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .chart-name {
      margin: 0;
      font-size: 0.98rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .chart-tag {
      flex-shrink: 0;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 600;
    }

    .chart-desc {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .footer-note {
      margin-top: 20px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    @media (min-width: 760px) {
      .grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 640px) {
      .page {
        padding: 24px 16px 56px;
      }

      .panel {
        padding: 20px;
      }

      .chart-top {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

          <a class="chart-link" href="predicted-stress-for-t25-to-t60-using-ExtVW-strain-as-a-baseline.html">

      </div>

      <div class="section">
        <div class="section-header">

        <div class="grid">
          <a class="chart-link" href="Agg-types-shrink-strain.html">
            <div class="chart-top">

      <p class="footer-note">
        Hosted as static HTML so each figure remains interactive and easy to open directly from a live link.

    </section>
  </main>
</body>
</html>
